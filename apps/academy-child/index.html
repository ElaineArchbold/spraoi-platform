<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#ffffff" />

    <meta
      name="description"
      content="Spraoi Academy — the player and parent experience from Spraoi Sports."
    />

    <!-- Spraoi Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700;800&family=Work+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png?v=spraoi-20260817" />

    <!-- iPhone / iPad Home Screen Icon -->
    <link rel="icon" type="image/png" href="/favicon.png?v=spraoi-20260817" />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta name="mobile-web-app-capable" content="yes" />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Spraoi Academy"
    />

    <title>Spraoi</title>

    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Work Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      h1,
      h2,
      h3,
      h4,
      .academy-title,
      .spraoi-title {
        font-family: "League Spartan", sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font-family: "Work Sans", sans-serif;
      }
      /* SPRAOI INSTALLED MOBILE TEXT */
      @media (display-mode: standalone) and (max-width: 700px) {
        html {
          -webkit-text-size-adjust: 115%;
          text-size-adjust: 115%;
        }

        #root [style*="font-size: 9px"]  { font-size: 11px !important; }
        #root [style*="font-size: 10px"] { font-size: 12px !important; }
        #root [style*="font-size: 11px"] { font-size: 13px !important; }
        #root [style*="font-size: 12px"] { font-size: 14px !important; }
        #root [style*="font-size: 13px"] { font-size: 14px !important; }

        input,
        select,
        textarea {
          font-size: 16px !important;
        }
      }
    </style>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=spraoi-20260817" />
</head>

  <body>
    <div id="root"></div>
